name: Sync Copilot Instructions

on:
  push:
    branches: [ main ]
    paths: [ 'CLAUDE.md' ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
    - name: Copy CLAUDE.md to .github/copilot-instructions.md
      run: cp CLAUDE.md .github/copilot-instructions.md
    - name: Open PR if changed
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/copilot-instructions.md
        git diff --cached --quiet && exit 0
        BRANCH="chore/sync-copilot-instructions-$(date +%s)"
        git checkout -b "$BRANCH"
        git commit -m "chore: sync copilot-instructions.md from CLAUDE.md"
        git push origin "$BRANCH"
        gh pr create \
          --title "chore: sync copilot-instructions.md from CLAUDE.md" \
          --body "Auto-generated: syncs \`.github/copilot-instructions.md\` from \`CLAUDE.md\`." \
          --base main \
          --head "$BRANCH"
