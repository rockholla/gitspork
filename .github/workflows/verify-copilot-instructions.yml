name: Verify Copilot Instructions Sync

on:
  pull_request:
    branches: [ main ]

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check CLAUDE.md matches .github/copilot-instructions.md
      run: |
        if ! diff -q CLAUDE.md .github/copilot-instructions.md > /dev/null 2>&1; then
          echo "::error::CLAUDE.md and .github/copilot-instructions.md are out of sync. Run: cp CLAUDE.md .github/copilot-instructions.md"
          diff CLAUDE.md .github/copilot-instructions.md || true
          exit 1
        fi
